<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 ALERTA 🚨</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 1.5rem;
            color: #ff3b69;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .meme-container {
            margin-bottom: 24px;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }

        /* Ajuste do embed do Tenor */
        .meme-container .tenor-gif-embed {
            width: 100% !important;
            margin: 0 auto !important;
        }

        p {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                45deg,
                #f09433,
                #e6683c,
                #dc2743,
                #cc2366,
                #bc1888
            );
            color: #fff;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.35);
            transition: transform 0.2s ease, opacity 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: scale(1.03);
            opacity: 0.95;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🚨 ALERTA DO SISTEMA 🚨</h1>

        <div class="meme-container">

            <!-- GIF: Homer desaparecendo nos arbustos -->
            <div 
                class="tenor-gif-embed" 
                data-postid="4325800" 
                data-share-method="host" 
                data-aspect-ratio="1.3369" 
                data-width="100%"
            >
                <a href="https://tenor.com/view/the-s-impsons-bush-homer-simpsons-homer-hiding-gif-4325800">
                    Homer Disappearing Into Bush - The Simpsons GIF
                </a>
                from 
                <a href="https://tenor.com/search/the+s+impsons-gifs">
                    The S Impsons GIFs
                </a>
            </div>

        </div>

        <p>
            Aviso: O perfil solicitado já está comprometido.
            Prossiga por sua própria conta e risco!
        </p>

        <!-- Link real do Instagram -->
        <a 
            href="https://www.instagram.com/isabellynicolerios/" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="btn"
        >
            Ir para o Instagram mesmo assim
        </a>

    </div>

    <!-- Script necessário para carregar o GIF do Tenor -->
    <script 
        type="text/javascript" 
        async 
        src="https://tenor.com/embed.js">
    </script>

</body>
</html>
